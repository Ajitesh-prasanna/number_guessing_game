<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Number Guessing Game</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; }
		form { display: flex; gap: .5rem; flex-wrap: wrap; }
		input, button { font: inherit; padding: .5rem; }
		#message { min-height: 1.5em; }
	</style>
</head>
<body>
	<h1>Number Guessing Game</h1>
	<p>I'm thinking of a number from 1 to 100. Can you guess it?</p>
	<form id="guess-form">
		<label for="guess">Your guess:</label>
		<input id="guess" type="number" min="1" max="100" required autofocus>
		<button type="submit">Guess</button>
	</form>
	<p id="message" role="status" aria-live="polite">You have 0 guesses.</p>
	<button id="reset" type="button" hidden>Play again</button>

	<script>
		const form = document.getElementById('guess-form');
		const input = document.getElementById('guess');
		const message = document.getElementById('message');
		const resetButton = document.getElementById('reset');
		let answer;
		let guesses;

		function startGame() {
			answer = Math.floor(Math.random() * 100) + 1;
			guesses = 0;
			input.value = '';
			input.disabled = false;
			form.querySelector('button').disabled = false;
			resetButton.hidden = true;
			message.textContent = 'You have 0 guesses.';
			input.focus();
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const guess = Number(input.value);
			if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
				message.textContent = 'Enter a whole number from 1 to 100.';
				return;
			}

			guesses++;
			if (guess === answer) {
				message.textContent = `Correct! You got it in ${guesses} ${guesses === 1 ? 'guess' : 'guesses'}.`;
				input.disabled = true;
				form.querySelector('button').disabled = true;
				resetButton.hidden = false;
			} else {
				message.textContent = `${guess < answer ? 'Too low' : 'Too high'}! Try again. Guesses: ${guesses}.`;
				input.select();
			}
		});

		resetButton.addEventListener('click', startGame);
		startGame();
	</script>
</body>
</html>
